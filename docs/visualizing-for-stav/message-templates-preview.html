<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>תצוגה מקדימה - הודעות וואטסאפ | שבילי הקמה</title>
<style>
  :root{
    --wa-bg:#e5ddd5;
    --wa-header:#075e54;
    --wa-header-dark:#054c40;
    --wa-bubble:#dcf8c6;
    --wa-bubble-shadow:rgba(0,0,0,.08);
    --wa-teal:#25d366;
    --panel:#f7f7f8;
    --ink:#111b21;
    --muted:#667781;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:"Segoe UI","Arial",sans-serif;
    background:#0b141a; color:var(--ink);
    direction:rtl;
  }
  .app{
    display:flex; min-height:100vh;
  }
  /* Sidebar: template list */
  .sidebar{
    width:300px; flex:0 0 300px; background:var(--panel);
    border-left:1px solid #d9dde1; height:100vh; overflow-y:auto;
    position:sticky; top:0;
  }
  .sidebar h1{
    font-size:15px; margin:0; padding:16px 14px 10px;
    color:var(--wa-header); border-bottom:1px solid #e2e5e8;
  }
  .sidebar .sub{
    font-size:11.5px; color:var(--muted); padding:0 14px 12px; border-bottom:1px solid #e2e5e8;
  }
  .tpl-item{
    padding:11px 14px; cursor:pointer; border-bottom:1px solid #ececec;
    font-size:13px; display:flex; gap:8px; align-items:flex-start;
  }
  .tpl-item:hover{ background:#eef1f2; }
  .tpl-item.active{ background:#dff3ea; border-right:3px solid var(--wa-teal); }
  .tpl-num{
    flex:0 0 auto; width:20px; height:20px; border-radius:50%;
    background:var(--wa-header); color:#fff; font-size:11px;
    display:flex; align-items:center; justify-content:center; font-weight:600;
  }
  .tpl-title{ flex:1; line-height:1.35; }
  .tpl-title small{ display:block; color:var(--muted); font-size:10.5px; margin-top:2px;}

  /* Phone / chat panel */
  .phone-wrap{
    flex:1; display:flex; align-items:center; justify-content:center;
    padding:28px; background:radial-gradient(circle at 30% 20%, #16262b, #0b141a 60%);
  }
  .phone{
    width:380px; max-width:100%; height:760px; background:#000;
    border-radius:38px; padding:12px; box-shadow:0 20px 60px rgba(0,0,0,.55);
    display:flex; flex-direction:column;
  }
  .screen{
    flex:1; background:var(--wa-bg); border-radius:26px; overflow:hidden;
    display:flex; flex-direction:column;
    background-image:
      linear-gradient(rgba(229,221,213,.94), rgba(229,221,213,.94)),
      repeating-linear-gradient(45deg, rgba(0,0,0,.02) 0 2px, transparent 2px 40px);
  }
  .wa-header{
    background:var(--wa-header); color:#fff; padding:14px 14px;
    display:flex; align-items:center; gap:10px; flex:0 0 auto;
  }
  .wa-header .avatar{
    width:36px; height:36px; border-radius:50%; background:#0a7a68;
    display:flex; align-items:center; justify-content:center; font-size:16px;
  }
  .wa-header .name{ font-size:14.5px; font-weight:600; }
  .wa-header .status{ font-size:11px; color:#cfe9e3; }
  .wa-header .name-wrap{ flex:1; }
  .wa-header .icons{ font-size:16px; opacity:.9; display:flex; gap:14px; }

  .messages{
    flex:1; padding:14px 10px; overflow-y:auto;
    display:flex; flex-direction:column; gap:10px;
    direction:ltr; /* keep sent-message alignment on the right, like real WhatsApp, regardless of Hebrew text */
  }
  .day-chip{
    align-self:center; background:#dcf4fa; color:#4a5a5f; font-size:11px;
    padding:4px 10px; border-radius:8px; margin-bottom:4px; direction:rtl;
  }
  .bubble{
    align-self:flex-end; background:var(--wa-bubble); border-radius:9px;
    border-top-right-radius:2px;
    padding:7px 9px 8px 9px; max-width:88%;
    box-shadow:0 1px 1px var(--wa-bubble-shadow);
    font-size:13.6px; line-height:1.5; color:var(--ink);
    white-space:pre-wrap; position:relative;
    direction:rtl; text-align:right;
  }
  .bubble .tail{
    position:absolute; top:0; right:-7px; width:0; height:0;
    border-top:8px solid var(--wa-bubble); border-right:8px solid transparent;
  }
  .bubble .meta{
    display:block; text-align:left; direction:ltr; font-size:10.5px;
    color:#5b7a68; margin-top:3px;
  }
  .bubble .meta .check{ color:#53bdeb; }

  .wa-footer{
    flex:0 0 auto; padding:8px 10px; background:#f0f0f0;
    display:flex; align-items:center; gap:8px;
  }
  .wa-footer .input{
    flex:1; background:#fff; border-radius:20px; padding:9px 14px;
    color:#8a8a8a; font-size:13px;
  }
  .wa-footer .mic{
    width:36px; height:36px; border-radius:50%; background:var(--wa-header);
    color:#fff; display:flex; align-items:center; justify-content:center;
  }

  .side-note{
    margin:12px 14px 0; padding:10px 12px; background:#fff6e0;
    border-right:3px solid #e0a300; border-radius:6px;
    font-size:12px; color:#5a4600; line-height:1.5;
  }
  .side-meta{
    margin:12px 14px 0; padding:10px 12px; background:#eef4ff;
    border-right:3px solid #3b6fd6; border-radius:6px;
    font-size:12px; color:#1f3a66; line-height:1.6;
  }
  .side-meta b{ color:#0b3b8c; }
  .footer-credit{
    text-align:center; color:#5b6a70; font-size:11px; padding:14px;
  }
  code.var{
    direction:ltr; unicode-bidi:embed; display:inline-block;
    background:#c9f0dc; color:#0b6b3a; border-radius:4px; padding:0 4px;
    font-size:12px;
  }
</style>
</head>
<body>
<div class="app">
  <div class="sidebar" id="sidebar">
    <h1>תצוגה מקדימה — הודעות וואטסאפ</h1>
    <div class="sub">שבילי הקמה · לחצו על הודעה כדי לראות איך היא נראית בצ'אט (עם נתוני דוגמה)</div>
    <div id="tplList"></div>
  </div>
  <div class="phone-wrap">
    <div class="phone">
      <div class="screen">
        <div class="wa-header">
          <div class="avatar">🥾</div>
          <div class="name-wrap">
            <div class="name">שבילי הקמה</div>
            <div class="status" id="statusLine">מקוון</div>
          </div>
          <div class="icons">📹 📞 ⋮</div>
        </div>
        <div class="messages" id="messages"></div>
        <div class="wa-footer">
          <div class="input">הקלידו הודעה</div>
          <div class="mic">🎤</div>
        </div>
      </div>
    </div>
  </div>
</div>
<div id="metaPanel"></div>

<script>
// Sample values used to fill {{variables}} for the preview only
const sample = {
  "שם_לקוח": "דניאל",
  "שם_טיול": "מערת קומראן",
  "תאריך": "24.8.2026",
  "שעה": "07:30",
  "מספר_משתתפים": "4",
  "סכום": "760",
  "קישור_תשלום": "kama-trails.co.il/pay/8f3a",
  "קישור_מדיניות": "kama-trails.co.il/policy",
  "קישור_וייז": "waze.com/ul/hsv8x2u1",
  "שם_מדריך": "סתיו",
  "טלפון_מדריך": "052-1234567",
  "קישור_אינסטגרם": "instagram.com/kama.trails",
  "קישור_פייסבוק": "facebook.com/kama.trails",
  "דמי_ביטול": "150",
  "סכום_החזר": "610",
  "תחזית": "☀️ תחזית ליום הטיול: 27° וללא רוח.",
  "סיבת_ביטול": "לא הושלם מספר המשתתפים המינימלי",
  "פירוט_החזר": "מאחר שהביטול בוצע 9 ימים לפני הטיול, יבוצע החזר בניכוי דמי ביטול"
};

function fill(text){
  return text.replace(/\{\{(.*?)\}\}/g, (m, key) => {
    const k = key.trim();
    return sample[k] !== undefined ? sample[k] : m;
  });
}

const templates = [
  {
    num: 1, title: "מענה אוטומטי לפנייה חדשה", when: "מיד עם פנייה חדשה", channel: "וואטסאפ", issue: "#40",
    text: `היי {{שם_לקוח}}! 🙌 קיבלנו את פנייתכם לשבילי הקמה, תודה שפניתם אלינו.

כדי שנחזור אליכם עם כל הפרטים והצעה שמתאימה בדיוק לכם, נשמח אם תענו כאן בקצרה:

1️⃣ איזה טיול / מסלול מעניין אתכם? (ואם אין מסלול מסוים — איזה אזור?)
2️⃣ באיזה תאריך או טווח תאריכים?
3️⃣ כמה משתתפים? (וגילאים אם רלוונטי)

נחזור אליכם בהקדם עם כל המידע. יום כיף בשטח מחכה לכם! 🏞️`,
    note: null
  },
  {
    num: 2, title: "אישור הרשמה — מראש (מעל 14 יום)", when: "מיד לאחר ההרשמה", channel: "וואטסאפ + מייל", issue: "#39 / #23",
    text: `היי {{שם_לקוח}}, ההרשמה שלכם התקבלה! ✅

📍 טיול: {{שם_טיול}}
🗓️ תאריך: {{תאריך}} בשעה {{שעה}}
👥 משתתפים: {{מספר_משתתפים}}
💳 סכום לתשלום: {{סכום}} ₪

החיוב יבוצע באופן אוטומטי כ-14 יום לפני מועד הטיול — עד אז לא מתבצע כל חיוב.
מדיניות הביטולים המלאה: {{קישור_מדיניות}}

נתראה בשטח! 🧗`,
    note: `הערה לסתיו (לא ללקוח): לא כותבים "שמרנו את הכרטיס שלך" — הפרטים נשמרים אצל קארדקום, לא אצלנו. ההודעה מדגישה מתי וכמה יחויב.`
  },
  {
    num: 3, title: "אישור הרשמה — רגע אחרון (עד 14 יום)", when: "הרשמה עם פחות מ-14 יום — חיוב מיידי", channel: "וואטסאפ + מייל", issue: "#39 / #31",
    text: `היי {{שם_לקוח}}, ההרשמה שלכם אושרה והתשלום התקבל! 🎉

📍 טיול: {{שם_טיול}}
🗓️ תאריך: {{תאריך}} בשעה {{שעה}}
👥 משתתפים: {{מספר_משתתפים}}
💳 שולם: {{סכום}} ₪ — החשבונית נשלחה אליכם למייל.

נשלח לכם תזכורת עם נקודת המפגש ופרטי המדריך לקראת המועד. מחכים לכם! 🌄`,
    note: null
  },
  {
    num: 4, title: "אישור חיוב + חשבונית", when: "כ-14 יום לפני, בזמן הגבייה", channel: "וואטסאפ + מייל", issue: "#39 / #31",
    text: `היי {{שם_לקוח}}, קיבלנו את התשלום עבור {{שם_טיול}} ({{תאריך}}) 🎉
סכום: {{סכום}} ₪. החשבונית/קבלה נשלחה אליכם למייל.

מתקרבים לטיול — נשלח תזכורת עם כל הפרטים לקראת המועד. מחכים לכם! 🏞️`,
    note: null
  },
  {
    num: 5, title: "בעיה בחיוב — השלמת תשלום", when: "אחרי כשל בחיוב האוטומטי", channel: "וואטסאפ + מייל", issue: "#36",
    text: `היי {{שם_לקוח}}, ניסינו לחייב את התשלום עבור {{שם_טיול}} ({{תאריך}}) אך החיוב לא עבר. 😕

כדי לשמור על מקומכם בטיול, נא להשלים את התשלום בקישור המאובטח:
{{קישור_תשלום}}

המקום שמור לכם ליומיים הקרובים. לכל שאלה אנחנו כאן. 🙏`,
    note: null
  },
  {
    num: 6, title: "תזכורת שבוע לפני", when: "כ-7 ימים לפני הטיול", channel: "וואטסאפ", issue: "#39",
    text: `היי {{שם_לקוח}}, עוד שבוע לטיול {{שם_טיול}}! 🗓️
תאריך: {{תאריך}} בשעה {{שעה}}.

קרוב למועד נשלח לכם את נקודת המפגש המדויקת (Waze) ואת פרטי המדריך. מתרגשים לקראת! 🧗‍♂️`,
    note: null
  },
  {
    num: 7, title: "תזכורת ערב לפני (Waze + מדריך)", when: "בערב שלפני הטיול", channel: "וואטסאפ", issue: "#39",
    text: `היי {{שם_לקוח}}, מחר יוצאים לטיול {{שם_טיול}}! 🎒

📍 נקודת מפגש: {{קישור_וייז}}
🕐 שעה: {{שעה}}
👤 המדריך/ה שלכם: {{שם_מדריך}} — {{טלפון_מדריך}}

מה להביא: נעליים סגורות, מים, כובע וקרם הגנה.
{{תחזית}}

נתראה מחר, הולך להיות מדהים! ☀️`,
    note: `הערה: שורת {{תחזית}} אופציונלית — למחוק אם לא רוצים תחזית מזג אוויר.`
  },
  {
    num: 8, title: "יום אחרי — שיתוף ורשתות", when: "יום/ערב אחרי הטיול", channel: "וואטסאפ", issue: "#39",
    text: `היי {{שם_לקוח}}, תודה שהצטרפתם אלינו לטיול {{שם_טיול}}! 🙏 מקווים שנהניתם.

נשמח אם תשתפו את החוויה ותעקבו אחרינו:
📸 אינסטגרם: {{קישור_אינסטגרם}}
👍 פייסבוק: {{קישור_פייסבוק}}

נשמח לראות את התמונות שלכם! עד הטיול הבא 🏞️`,
    note: `הערה לסתיו: ההצעה של "הנחה לטיול הבא בעקבות שיתוף" הוצאה מהסקופ הנוכחי (תוספת עתידית).`
  },
  {
    num: 9, title: "ביטול טיול מצד החברה", when: "לא הגיע למינימום / מזג אוויר / כוח עליון", channel: "וואטסאפ + מייל", issue: "#42",
    text: `היי {{שם_לקוח}}, אנחנו מצטערים לעדכן שהטיול {{שם_טיול}} בתאריך {{תאריך}} בוטל.

בהתאם למדיניות הביטולים — {{סיבת_ביטול}} — מלוא התשלום ({{סכום}} ₪) יוחזר לכרטיס האשראי שלכם.

נשמח מאוד לארח אתכם בטיול אחר — דברו איתנו ונתאם. מתנצלים על אי-הנוחות. 🙏`,
    note: `הערה: {{סיבת_ביטול}} = טקסט קצר. אם החיוב עדיין לא בוצע (ביטול מוקדם) — אפשר גרסה בלי שורת ההחזר.`
  },
  {
    num: 10, title: "אישור ביטול מצד הלקוח", when: "כשלקוח מבטל השתתפות", channel: "וואטסאפ + מייל", issue: "#37",
    text: `היי {{שם_לקוח}}, קיבלנו את בקשתכם לבטל את ההשתתפות בטיול {{שם_טיול}} ({{תאריך}}).

בהתאם למדיניות הביטולים ({{קישור_מדיניות}}): {{פירוט_החזר}}.
סכום ההחזר: {{סכום_החזר}} ₪ — יוחזר לכרטיס האשראי שלכם.

מקווים לראותכם בטיול אחר בקרוב! 🌄`,
    note: `הערה: {{פירוט_החזר}} נגזר מהמדיניות לפי כמה זמן לפני הטיול בוטל. אם קארדקום גובה עמלת זיכוי — להוסיף את זה בניסוח.`
  }
];

const listEl = document.getElementById('tplList');
const messagesEl = document.getElementById('messages');
const statusEl = document.getElementById('statusLine');
const metaEl = document.getElementById('metaPanel');

function render(idx){
  const t = templates[idx];
  // sidebar active state
  [...listEl.children].forEach((el,i)=> el.classList.toggle('active', i===idx));

  statusEl.textContent = t.channel;

  messagesEl.innerHTML = '';
  const dayChip = document.createElement('div');
  dayChip.className = 'day-chip';
  dayChip.textContent = 'היום';
  messagesEl.appendChild(dayChip);

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = `<div class="tail"></div>${escapeHtml(fill(t.text))}<span class="meta">${randTime()} <span class="check">✓✓</span></span>`;
  messagesEl.appendChild(bubble);

  let metaHtml = `<div class="side-meta"><b>מתי נשלחת:</b> ${t.when}<br><b>ערוץ:</b> ${t.channel}<br><b>אשיו:</b> ${t.issue}</div>`;
  if(t.note){
    metaHtml += `<div class="side-note"><b>${t.note.split(':')[0]}:</b>${t.note.split(':').slice(1).join(':')}</div>`;
  }
  metaHtml += `<div class="footer-credit">נתוני הדוגמה (שם, תאריך, סכום...) הם להמחשה בלבד</div>`;
  metaEl.innerHTML = metaHtml;
}

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function randTime(){
  return "09:1" + Math.floor(Math.random()*9);
}

templates.forEach((t, i)=>{
  const item = document.createElement('div');
  item.className = 'tpl-item';
  item.innerHTML = `<div class="tpl-num">${t.num}</div><div class="tpl-title">${t.title}<small>${t.channel} · ${t.issue}</small></div>`;
  item.addEventListener('click', ()=> render(i));
  listEl.appendChild(item);
});

render(0);
</script>
</body>
</html>
